components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: ntust-bgc-session
      description: Cookie Session authentication; no token is included in this document.
  schemas:
    ErrorResponse:
      type: object
      properties:
        message: { type: string }
        errors: { type: object, additionalProperties: true }
      required: [message]
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServerError:
      description: Server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
